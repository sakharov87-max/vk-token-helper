<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>VK Token</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <button id="btn" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background: #0077ff; color: #fff; border: none; border-radius: 8px;">
    Получить токен ВК
  </button>
  <pre id="out" style="margin: 30px auto; width: 80%; padding: 15px; background: #f0f0f0; text-align: left; white-space: pre-wrap; word-break: break-all;"></pre>

  <script>
    vkBridge.send('VKWebAppInit');
    document.getElementById('btn').onclick = async () => {
      try {
        const res = await vkBridge.send('VKWebAppGetAuthToken', {
          app_id: 54888639,
          scopes: ['wall', 'photos', 'docs', 'groups', 'offline', 'stats']
        });
        document.getElementById('out').textContent = res.access_token;
      } catch (err) {
        document.getElementById('out').textContent = JSON.stringify(err, null, 2);
      }
    };
  </script>
</body>
</html>
